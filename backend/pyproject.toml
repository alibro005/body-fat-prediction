[project]
name = "body-fat-prediction-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi[standard]==0.141.1",
    "joblib==1.5.3",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"